<svg
  width="100%"
  height="220"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 854 220"
>
  <style>
    .title {
      font-size: 44px;
      font-weight: 800;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .desc {
      font-size: 16px;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      fill: #ACE2E1;
      opacity: 0.95;
    }
    .title, .desc {
      animation: fadeIn 1.2s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <defs>
    <linearGradient id="userWaveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B192C" />
      <stop offset="45%" stop-color="#1E3E62" />
      <stop offset="80%" stop-color="#008DDA" />
      <stop offset="100%" stop-color="#41C9E2" />
    </linearGradient>
    <linearGradient id="userWaveBackGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050d18" />
      <stop offset="40%" stop-color="#13273e" />
      <stop offset="80%" stop-color="#005d91" />
      <stop offset="100%" stop-color="#2a9cb3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Animated Waves -->
  <g>
    <!-- Background Deep Wave -->
    <path d="M0 0 L0 160 Q 213.5 200 427 165 T 854 185 L 854 0 Z" fill="url(#userWaveBackGradient)" opacity="0.6">
      <animate
        attributeName="d"
        dur="16s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.25 0.1 0.25 1;0.25 0.1 0.25 1;0.25 0.1 0.25 1"
        begin="-8s"
        values="M0 0 L0 160 Q 213.5 200 427 165 T 854 185 L 854 0 Z;
                M0 0 L0 180 Q 213.5 150 427 185 T 854 160 L 854 0 Z;
                M0 0 L0 150 Q 213.5 185 427 155 T 854 190 L 854 0 Z;
                M0 0 L0 160 Q 213.5 200 427 165 T 854 185 L 854 0 Z">
      </animate>
    </path>

    <!-- Mid Wave -->
    <path d="M0 0 L0 145 Q 213.5 185 427 155 T 854 175 L 854 0 Z" fill="url(#userWaveGradient)" opacity="0.8">
      <animate
        attributeName="d"
        dur="18s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.25 0.1 0.25 1;0.25 0.1 0.25 1;0.25 0.1 0.25 1"
        begin="0s"
        values="M0 0 L0 145 Q 213.5 185 427 155 T 854 175 L 854 0 Z;
                M0 0 L0 165 Q 213.5 140 427 175 T 854 150 L 854 0 Z;
                M0 0 L0 180 Q 213.5 160 427 140 T 854 170 L 854 0 Z;
                M0 0 L0 145 Q 213.5 185 427 155 T 854 175 L 854 0 Z">
      </animate>
    </path>

    <!-- Foreground Light Crest Wave -->
    <path d="M0 0 L0 155 Q 213.5 195 427 170 T 854 180 L 854 0 Z" fill="url(#userWaveGradient)" opacity="0.5">
      <animate
        attributeName="d"
        dur="14s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.25 0.1 0.25 1;0.25 0.1 0.25 1;0.25 0.1 0.25 1"
        begin="-4s"
        values="M0 0 L0 155 Q 213.5 195 427 170 T 854 180 L 854 0 Z;
                M0 0 L0 170 Q 213.5 145 427 145 T 854 165 L 854 0 Z;
                M0 0 L0 140 Q 213.5 170 427 185 T 854 155 L 854 0 Z;
                M0 0 L0 155 Q 213.5 195 427 170 T 854 180 L 854 0 Z">
      </animate>
    </path>
  </g>

  <!-- Typography -->
  <g filter="url(#glow)">
    <text text-anchor="middle" dominant-baseline="middle" x="50%" y="36%" class="title">SurakshaDrishti UserApp</text>
    <text text-anchor="middle" dominant-baseline="middle" x="50%" y="58%" class="desc">Civilian Incident Hub and Tactical Field Client</text>
  </g>
</svg>
