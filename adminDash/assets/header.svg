<svg
  width="100%"
  height="220"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  viewBox="0 0 854 220"
>
  <style>
    .title {
      font-size: 44px;
      font-weight: 800;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .desc {
      font-size: 16px;
      font-weight: 500;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      fill: #F3EDE2;
      opacity: 0.95;
    }
    .title, .desc {
      animation: fadeIn 1.2s ease-in-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <defs>
    <linearGradient id="adminWaveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="35%" stop-color="#8B7355" />
      <stop offset="70%" stop-color="#B85C38" />
      <stop offset="100%" stop-color="#2D7A4F" />
    </linearGradient>
    <linearGradient id="adminWaveBackGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="40%" stop-color="#6e5b43" />
      <stop offset="75%" stop-color="#93492c" />
      <stop offset="100%" stop-color="#215939" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Animated Waves -->
  <g>
    <!-- Background Deep Wave -->
    <path d="M0 0 L0 160 Q 213.5 200 427 165 T 854 185 L 854 0 Z" fill="url(#adminWaveBackGradient)" opacity="0.6">
      <animate
        attributeName="d"
        dur="16s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.25 0.1 0.25 1;0.25 0.1 0.25 1;0.25 0.1 0.25 1"
        begin="-8s"
        values="M0 0 L0 160 Q 213.5 200 427 165 T 854 185 L 854 0 Z;
                M0 0 L0 180 Q 213.5 150 427 185 T 854 160 L 854 0 Z;
                M0 0 L0 150 Q 213.5 185 427 155 T 854 190 L 854 0 Z;
                M0 0 L0 160 Q 213.5 200 427 165 T 854 185 L 854 0 Z">
      </animate>
    </path>

    <!-- Mid Wave -->
    <path d="M0 0 L0 145 Q 213.5 185 427 155 T 854 175 L 854 0 Z" fill="url(#adminWaveGradient)" opacity="0.8">
      <animate
        attributeName="d"
        dur="18s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        begin="0s"
        values="M0 0 L0 145 Q 213.5 185 427 155 T 854 175 L 854 0 Z;
                M0 0 L0 165 Q 213.5 140 427 175 T 854 150 L 854 0 Z;
                M0 0 L0 180 Q 213.5 160 427 140 T 854 170 L 854 0 Z;
                M0 0 L0 145 Q 213.5 185 427 155 T 854 175 L 854 0 Z">
      </animate>
    </path>

    <!-- Foreground Light Crest Wave -->
    <path d="M0 0 L0 155 Q 213.5 195 427 170 T 854 180 L 854 0 Z" fill="url(#adminWaveGradient)" opacity="0.5">
      <animate
        attributeName="d"
        dur="14s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        begin="-4s"
        values="M0 0 L0 155 Q 213.5 195 427 170 T 854 180 L 854 0 Z;
                M0 0 L0 170 Q 213.5 145 427 145 T 854 165 L 854 0 Z;
                M0 0 L0 140 Q 213.5 170 427 185 T 854 155 L 854 0 Z;
                M0 0 L0 155 Q 213.5 195 427 170 T 854 180 L 854 0 Z">
      </animate>
    </path>
  </g>

  <!-- Typography -->
  <g filter="url(#glow)">
    <text text-anchor="middle" dominant-baseline="middle" x="50%" y="36%" class="title">SurakshaDrishti AdminDash</text>
    <text text-anchor="middle" dominant-baseline="middle" x="50%" y="58%" class="desc">Central Command Hub and Tactical Operations Server</text>
  </g>
</svg>
